<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ค้นงบประมาณ 2570</title>
<style>body{max-width:1100px;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif;color:#17212b}h1{color:#1f4e79}form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:.6rem}input,select,button{padding:.7rem;font:inherit;border:1px solid #b8c3cc;border-radius:.4rem}button{background:#1f4e79;color:white;border:0;font-weight:700}.meta{margin:1rem 0;color:#50606d}.item{border-top:1px solid #d9e0e5;padding:1rem 0}.amount{font-weight:700;color:#174d2c}.small{font-size:.9rem;color:#50606d}@media(max-width:680px){form{grid-template-columns:1fr}}</style></head>
<body><header><h1>ค้นงบประมาณ 2570</h1><a href="/logout">ออกจากระบบ</a></header>
<form id="search"><input name="q" autofocus placeholder="คำค้น เช่น การศึกษา"><input name="ministry" placeholder="กระทรวง/หน่วยงาน"><select name="sort"><option value="amount">วงเงิน: มากไปน้อย</option><option value="amount_asc">วงเงิน: น้อยไปมาก</option><option value="book">ตามเล่ม</option></select><button>ค้นหา</button></form>
<p class="meta" id="meta">พิมพ์คำค้นแล้วกดค้นหา</p><a id="export" hidden>ดาวน์โหลด CSV</a><main id="results"></main>
<script>
const money=n=>new Intl.NumberFormat('th-TH').format(n||0);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
document.querySelector('#search').addEventListener('submit',async e=>{e.preventDefault();const p=new URLSearchParams(new FormData(e.target));p.set('limit','100');const r=await fetch('/api/search?'+p);if(!r.ok){location='/login';return}const d=await r.json();document.querySelector('#meta').textContent=`พบ ${money(d.count)} รายการ · รวม ${money(d.sum)} บาท · วิธีค้นหา ${d.mode}`;const ex=document.querySelector('#export');ex.href='/api/export.csv?'+p;ex.hidden=false;document.querySelector('#results').innerHTML=d.rows.map(x=>`<article class="item"><div class="amount">${money(x.amount)} บาท</div><div>${esc(x.text)}</div><p class="small">${esc(x.book_label)} หน้า ${esc(x.page)} ${x.ministry?' · '+esc(x.ministry):''} ${x.province?' · '+esc(x.province):''}</p><a href="${encodeURI(x.pdf)}" target="_blank" rel="noopener">เปิด PDF</a></article>`).join('')||'<p>ไม่พบรายการ</p>'});
</script></body></html>
